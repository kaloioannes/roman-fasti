name: Validate pull requests
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild text and stories
        run: |
          pip install opencc-python-reimplemented==0.1.7
          python scripts/build_data.py
          git diff --exit-code -- data/republic.json data/stories.json
      - name: Validate years, maps, stories and copy
        run: npm run validate
