name: Validate pull requests
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild text and stories
        run: |
          pip install opencc-python-reimplemented==0.1.7
          python scripts/build_data.py
          python scripts/build_empire.py
          python scripts/build_kingdom.py
          git diff --exit-code -- data/republic/records.json data/republic/stories.json data/empire/records.json data/kingdom/records.json
      - name: Validate years, maps, stories and copy
        run: npm run validate
      - name: Validate release assets
        run: |
          python scripts/build_site.py
          node scripts/validate-release.mjs
      - name: Check rendered release and cached upgrades
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          npm run test:ui
          npm run test:release
