name: Validate pull requests
on:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild text and stories
        run: |
          pip install opencc-python-reimplemented==0.1.7 shapely==2.1.2
          python scripts/build_map.py
          python scripts/build_data.py
          python scripts/build_empire.py
          python scripts/build_kingdom.py
          python scripts/build_byzantine.py
          python scripts/build_divided_empire.py
          python scripts/build_divided_empire_map.py
          python scripts/build_republic_people.py
          python scripts/build_people.py
          python scripts/build_events.py
          python scripts/build_timeline.py
          python scripts/build_glossary.py
          python scripts/build_dynasties.py
          python scripts/build_power.py
          python scripts/build_stories.py
          python scripts/build_search.py
          git diff --exit-code -- data/republic/records.json data/republic/stories.json data/republic/territories.json data/republic/people.json docs/republic-identity-review.md data/empire/records.json data/kingdom/records.json data/byzantine/records.json data/divided-empire/records.json data/divided-empire/places.json data/divided-empire/territories.json data/people/index.json data/search/index.json
          git diff --exit-code -- data/events data/timeline data/glossary data/dynasties data/power data/stories
      - name: Check evidence-based biography growth
        run: npm run test:biographies
      - name: Validate years, maps, stories and copy
        run: npm run validate
      - name: Validate release assets
        run: |
          python scripts/build_site.py
          node scripts/validate-release.mjs
      - name: Check rendered release and cached upgrades
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
          npm run test:ui
          npm run test:release
